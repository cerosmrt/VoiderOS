[package]
name    = "voider-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voider-rs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui   = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# El PDF es opcional: rust-fontconfig, que printpdf arrastra, no linkea al
# cross-compilar a Windows. Con --no-default-features sale el .exe sin exportar
# PDF; en Linux va incluido, que es donde se usa para imprimir el libro.
printpdf = { version = "0.12.6", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

[features]
default = ["pdf"]
pdf = ["dep:printpdf"]
