[package]
name    = "voider-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voider-rs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui   = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
