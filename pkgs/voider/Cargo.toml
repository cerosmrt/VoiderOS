[package]
name    = "voider"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voider"
path = "src/main.rs"

[dependencies]
# Wayland client + layer-shell + keyboard + shm
smithay-client-toolkit = { version = "0.18", features = ["calloop"] }
wayland-client          = "0.31"
wayland-protocols-wlr   = { version = "0.2", features = ["client"] }

# Font rasterization — pure Rust
fontdue    = "0.8"

# Config (~/.config/voideros/config.toml)
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"
shellexpand = "3"

# Error handling + logging
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
